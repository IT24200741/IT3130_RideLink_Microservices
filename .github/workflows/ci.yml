name: RideLink Microservices CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-services:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [account-service, driver-service, ride-service, payment-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: |
          cd services/${{ matrix.service }}
          npm install

      - name: Run Automated Unit Tests
        run: |
          cd services/${{ matrix.service }}
          npm test
