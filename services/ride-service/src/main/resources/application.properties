server.port=8082
spring.application.name=ride-service

# Isolated H2 Database for Database-per-Service Architecture
spring.datasource.url=jdbc:h2:mem:ridedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Owner metadata
service.owner=Bhanuka (IT24103298)
